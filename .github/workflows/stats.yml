name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *" # Executa todos os dias às 03:00 UTC
  push:
    paths:
      - ".github/workflows/streak-stats.yml" # Executa quando este arquivo for alterado
  workflow_dispatch: # Permite rodar manualmente na aba Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=felipeBribeiro&theme=radical&disable_animations=true&locale=pt_BR
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
          
